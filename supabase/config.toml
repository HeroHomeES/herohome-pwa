project_id = "zqkvcphtqmibttgnivku"

# whatsapp-agent recibe el webhook de Meta (sin JWT de Supabase) y valida la
# firma HMAC X-Hub-Signature-256 por su cuenta → verify_jwt debe estar en false.
[functions.whatsapp-agent]
verify_jwt = false

# process-idealista-lead se invoca desde Make (Escenario 2) con x-api-key, sin
# JWT de Supabase → verify_jwt debe estar en false.
[functions.process-idealista-lead]
verify_jwt = false

# visit-reminders lo invoca el cron (pg_cron) con x-api-key, sin JWT de Supabase.
[functions.visit-reminders]
verify_jwt = false

# generate-slots: el cron la llama con x-api-key (modo todas las viviendas) y la PWA
# con JWT de usuario (modo single-property; el ownership se valida en la función).
[functions.generate-slots]
verify_jwt = false

# post-visit-followup lo invoca el cron (pg_cron) con x-api-key, sin JWT de Supabase.
[functions.post-visit-followup]
verify_jwt = false
